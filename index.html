<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRODE Mundial 2026 - Sistema de Pronósticos</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tablericons/1.35.0/iconfont/tabler-icons.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --secondary: #ec4899;
      --accent: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --dark: #0f172a;
      --dark-secondary: #1e293b;
      --dark-tertiary: #334155;
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --border: #475569;
      --border-light: #334155;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 40px 80px rgba(0, 0, 0, 0.6);
    }
    
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 50%, #16213e 100%);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    h1, h2, h3, .bebas {
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 0.05em;
      font-weight: 700;
    }
    
    /* ===== LOADING SCREEN ===== */
    .loading-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
    }
    
    .loading-spinner {
      width: 80px;
      height: 80px;
      border: 4px solid rgba(99, 102, 241, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-text {
      font-size: 18px;
      color: var(--text-secondary);
      font-weight: 500;
    }
    
    /* ===== LOGIN / REGISTRO ===== */
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: linear-gradient(135deg, #0f172a 0%, #1e3c72 50%, #2a5298 100%);
      position: relative;
      overflow: hidden;
    }
    
    .auth-container::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: rgba(99, 102, 241, 0.1);
      border-radius: 50%;
      top: -100px;
      right: -100px;
      z-index: 0;
    }
    
    .auth-container::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: rgba(236, 72, 153, 0.1);
      border-radius: 50%;
      bottom: -50px;
      left: -50px;
      z-index: 0;
    }
    
    .auth-box {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 24px;
      padding: 2.5rem;
      width: 100%;
      max-width: 450px;
      box-shadow: var(--shadow-lg);
      position: relative;
      z-index: 1;
      animation: slideUp 0.5s ease;
    }
    
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .auth-logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      margin: 0 auto 1.5rem;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
    }
    
    .auth-title {
      font-size: 32px;
      text-align: center;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .auth-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 2rem;
      font-weight: 500;
    }
    
    .form-group {
      margin-bottom: 1rem;
    }
    
    .form-label {
      display: block;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
    }
    
    .form-input {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      color: var(--text-primary);
      padding: 12px 14px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s;
    }
    
    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(99, 102, 241, 0.1);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }
    
    .form-input::placeholder {
      color: var(--text-muted);
    }
    
    .btn {
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.3s;
      font-family: 'Inter', sans-serif;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
    }
    
    .auth-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 1.5rem;
    }
    
    .auth-toggle button {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 600;
    }
    
    .auth-toggle button.active {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(236, 72, 153, 0.2));
      border-color: var(--primary);
      color: var(--primary);
    }
    
    /* ===== HEADER ===== */
    .header {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(51, 65, 85, 0.4));
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-light);
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    
    .header-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
    }
    
    .header h1 {
      font-size: 24px;
      color: var(--text-primary);
    }
    
    .header p {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
    }
    
    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    
    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 10px 14px;
    }
    
    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    
    .user-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }
    
    .user-role {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    
    .btn-logout {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 8px 14px;
      font-size: 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .btn-logout:hover {
      border-color: var(--danger);
      color: var(--danger);
    }
    
    /* ===== TABS ===== */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border-light);
      background: rgba(30, 41, 59, 0.5);
      padding: 0 2rem;
      overflow-x: auto;
      gap: 8px;
      -webkit-overflow-scrolling: touch;
    }
    
    .tab {
      padding: 16px 20px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      border-bottom: 2px solid transparent;
      transition: all 0.3s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .tab:hover {
      color: var(--text-primary);
    }
    
    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    
    .tab i {
      font-size: 16px;
    }
    
    /* ===== CONTENT ===== */
    .content {
      padding: 2rem;
      max-width: 1600px;
      margin: 0 auto;
    }
    
    .tab-content {
      animation: fadeIn 0.3s ease-in;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .card {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.6), rgba(51, 65, 85, 0.3));
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 2rem;
      backdrop-filter: blur(10px);
    }
    
    .card-title {
      font-size: 22px;
      color: var(--text-primary);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .card-title i {
      font-size: 28px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    /* ===== ALERT ===== */
    .alert {
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(10px);
    }
    
    .alert-locked {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(249, 115, 22, 0.1));
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }
    
    /* ===== PHASE ACCORDION ===== */
    .phase-section {
      background: linear-gradient(135deg, rgba(51, 65, 85, 0.3), rgba(30, 41, 59, 0.3));
      border: 1px solid var(--border-light);
      border-radius: 12px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }
    
    .phase-header {
      padding: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.3s;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(236, 72, 153, 0.05));
    }
    
    .phase-header:hover {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(236, 72, 153, 0.1));
    }
    
    .phase-header-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .phase-header-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .phase-match-count {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    
    .phase-toggle-icon {
      font-size: 20px;
      color: var(--primary);
      transition: transform 0.3s;
    }
    
    .phase-toggle-icon.open {
      transform: rotate(180deg);
    }
    
    .phase-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }
    
    .phase-content.open {
      max-height: 5000px;
    }
    
    .phase-content-inner {
      padding: 1.5rem;
      border-top: 1px solid var(--border-light);
    }
    
    /* ===== MATCH CARD ===== */
    .match-card {
      background: linear-gradient(135deg, rgba(51, 65, 85, 0.5), rgba(30, 41, 59, 0.5));
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 1.25rem;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
      margin-bottom: 1rem;
    }
    
    .match-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    .match-card:hover {
      border-color: var(--primary);
      box-shadow: 0 8px 32px rgba(99, 102, 241, 0.2);
      transform: translateY(-2px);
    }
    
    .match-card:hover::before {
      opacity: 1;
    }
    
    .match-card.locked {
      opacity: 0.6;
      pointer-events: none;
    }
    
    .match-date-venue {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    
    .match-date-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    /* ===== PRONÓSTICO BOX ===== */
    .pronostico-box {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(236, 72, 153, 0.1));
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 0.75rem;
    }
    
    .pronostico-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
    }
    
    .pronostico-row:last-child {
      margin-bottom: 0;
    }
    
    .team-input-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex: 1;
      min-width: 120px;
    }
    
    .team-flag {
      font-size: 28px;
      line-height: 1;
      min-width: 36px;
      text-align: center;
    }
    
    .team-name-text {
      font-weight: 600;
      font-size: 13px;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .team-input {
      width: 70px;
      height: 40px;
      text-align: center;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      padding: 8px;
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      font-family: 'Inter', sans-serif;
      transition: all 0.3s;
    }
    
    .team-input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(99, 102, 241, 0.15);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }
    
    .team-input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .team-input::placeholder {
      color: var(--text-muted);
    }
    
    .team-input::-webkit-outer-spin-button,
    .team-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    
    .team-input[type=number] {
      -moz-appearance: textfield;
    }
    
    .vs-separator {
      font-weight: 700;
      color: var(--text-muted);
      font-size: 14px;
      min-width: 20px;
      text-align: center;
    }
    
    .match-status {
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
      margin-top: 0.75rem;
    }
    
    .status-pending {
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
    }
    
    .status-predicted {
      background: rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
    }
    
    /* ===== BRACKET ===== */
    .bracket-container {
      overflow-x: auto;
      padding: 2rem 0;
    }
    
    .bracket {
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      gap: 2rem;
      min-width: 1400px;
      padding: 2rem;
      background: linear-gradient(135deg, rgba(51, 65, 85, 0.3), rgba(30, 41, 59, 0.3));
      border-radius: 16px;
      border: 1px solid var(--border-light);
    }
    
    .bracket-round {
      flex: 0 0 auto;
      min-width: 300px;
    }
    
    .bracket-round-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    
    .bracket-match {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(236, 72, 153, 0.05));
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 2rem;
      min-width: 280px;
      transition: all 0.3s;
    }
    
    .bracket-match:hover {
      border-color: var(--primary);
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.2);
    }
    
    .bracket-team {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border-light);
    }
    
    .bracket-team:last-child {
      border-bottom: none;
    }
    
    .bracket-team-info {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }
    
    .bracket-team-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }
    
    /* ===== ADMIN ===== */
    .admin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    
    .admin-stat {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(236, 72, 153, 0.1));
      border: 1px solid var(--border-light);
      border-radius: 14px;
      padding: 1.5rem;
      text-align: center;
    }
    
    .admin-stat-value {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0.5rem 0;
    }
    
    .admin-stat-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }
    
    .control-panel {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(236, 72, 153, 0.05));
      border: 1px solid var(--border-light);
      border-radius: 14px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    
    .toggle-switch {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 1rem;
    }
    
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 28px;
    }
    
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--border);
      transition: .4s;
      border-radius: 28px;
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background: linear-gradient(135deg, var(--success), var(--success));
    }
    
    input:checked + .slider:before {
      transform: translateX(22px);
    }
    
    .lock-status-text {
      color: var(--text-primary);
      font-weight: 600;
      font-size: 14px;
    }
    
    .danger-zone {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(249, 115, 22, 0.05));
      border: 1px solid var(--border-light);
      border-radius: 14px;
      padding: 1.5rem;
    }
    
    .btn-danger {
      background: linear-gradient(135deg, var(--danger), #dc2626);
    }
    
    .btn-danger:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(239, 68, 68, 0.4);
    }
    
    /* ===== SCROLL ===== */
    ::-webkit-scrollbar {
      height: 8px;
      width: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading-container">
      <div class="loading-spinner"></div>
      <div class="loading-text">Cargando PRODE...</div>
    </div>
  </div>

  <script>
    // ===== DATOS DEL MUNDIAL 2026 =====
    const MATCHES_DATA = {
      "group-phase": {
        title: "Fase de Grupos",
        groups: [
          {
            name: "Grupo A",
            matches: [
              { id: 1, date: "2026-06-10", time: "20:00", venue: "Los Angeles", team1: "Argentina", team2: "Canadá", flag1: "🇦🇷", flag2: "🇨🇦", status: "pending" },
              { id: 2, date: "2026-06-10", time: "20:00", venue: "Los Angeles", team1: "Perú", team2: "Panamá", flag1: "🇵🇪", flag2: "🇵🇦", status: "pending" },
              { id: 3, date: "2026-06-15", time: "20:00", venue: "Los Angeles", team1: "Argentina", team2: "Panamá", flag1: "🇦🇷", flag2: "🇵🇦", status: "pending" },
              { id: 4, date: "2026-06-15", time: "20:00", venue: "Los Angeles", team1: "Canadá", team2: "Perú", flag1: "🇨🇦", flag2: "🇵🇪", status: "pending" },
              { id: 5, date: "2026-06-20", time: "20:00", venue: "Los Angeles", team1: "Argentina", team2: "Perú", flag1: "🇦🇷", flag2: "🇵🇪", status: "pending" },
              { id: 6, date: "2026-06-20", time: "20:00", venue: "Los Angeles", team1: "Canadá", team2: "Panamá", flag1: "🇨🇦", flag2: "🇵🇦", status: "pending" }
            ]
          },
          {
            name: "Grupo B",
            matches: [
              { id: 7, date: "2026-06-11", time: "20:00", venue: "Dallas", team1: "España", team2: "Marruecos", flag1: "🇪🇸", flag2: "🇲🇦", status: "pending" },
              { id: 8, date: "2026-06-11", time: "20:00", venue: "Dallas", team1: "Alemania", team2: "México", flag1: "🇩🇪", flag2: "🇲🇽", status: "pending" },
              { id: 9, date: "2026-06-16", time: "20:00", venue: "Dallas", team1: "España", team2: "Alemania", flag1: "🇪🇸", flag2: "🇩🇪", status: "pending" },
              { id: 10, date: "2026-06-16", time: "20:00", venue: "Dallas", team1: "México", team2: "Marruecos", flag1: "🇲🇽", flag2: "🇲🇦", status: "pending" },
              { id: 11, date: "2026-06-21", time: "20:00", venue: "Dallas", team1: "España", team2: "México", flag1: "🇪🇸", flag2: "🇲🇽", status: "pending" },
              { id: 12, date: "2026-06-21", time: "20:00", venue: "Dallas", team1: "Alemania", team2: "Marruecos", flag1: "🇩🇪", flag2: "🇲🇦", status: "pending" }
            ]
          }
        ]
      },
      "knockout": {
        title: "Fase Final",
        rounds: [
          {
            title: "Octavos de Final",
            matches: [
              { id: 25, date: "2026-07-01", time: "20:00", venue: "New York", team1: "Ganador A1", team2: "Ganador B2", flag1: "🏆", flag2: "🏆", status: "pending" }
            ]
          }
        ]
      }
    };

    // ===== ESTADO GLOBAL =====
    let currentUser = null;
    let predictions = JSON.parse(localStorage.getItem('predictions')) || {};
    let isLocked = JSON.parse(localStorage.getItem('isLocked')) || false;

    // ===== AUTENTICACIÓN =====
    function showAuth() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="auth-container">
          <div class="auth-box">
            <div class="auth-logo">⚽</div>
            <h1 class="auth-title">PRODE 2026</h1>
            <p class="auth-subtitle">Sistema de Pronósticos Mundial</p>
            
            <div class="auth-toggle">
              <button class="toggle-btn active" data-mode="login">INICIAR SESIÓN</button>
              <button class="toggle-btn" data-mode="register">REGISTRARSE</button>
            </div>

            <form id="authForm">
              <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-input" id="email" placeholder="tu@email.com" required>
              </div>
              <div class="form-group">
                <label class="form-label">Contraseña</label>
                <input type="password" class="form-input" id="password" placeholder="••••••••" required>
              </div>
              <div class="form-group" id="nameGroup" style="display: none;">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-input" id="name" placeholder="Tu nombre completo">
              </div>
              <button type="submit" class="btn btn-primary">
                <i class="ti ti-login"></i>
                INGRESAR
              </button>
            </form>
          </div>
        </div>
      `;

      let mode = 'login';
      document.querySelectorAll('.toggle-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          mode = e.target.dataset.mode;
          document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          document.getElementById('nameGroup').style.display = mode === 'register' ? 'block' : 'none';
          document.querySelector('.btn-primary').innerHTML = mode === 'login' ? 
            '<i class="ti ti-login"></i> INGRESAR' : 
            '<i class="ti ti-user-plus"></i> REGISTRARSE';
        });
      });

      document.getElementById('authForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const name = document.getElementById('name').value || email.split('@')[0];
        currentUser = { email, name, role: email.includes('admin') ? 'admin' : 'user' };
        localStorage.setItem('user', JSON.stringify(currentUser));
        showApp();
      });
    }

    // ===== INTERFAZ PRINCIPAL =====
    function showApp() {
      const html = `
        <div class="header">
          <div class="header-left">
            <div class="header-icon">⚽</div>
            <div>
              <h1>PRODE MUNDIAL 2026</h1>
              <p>Sistema de Pronósticos</p>
            </div>
          </div>
          <div class="header-right">
            <div class="user-info">
              <div class="user-avatar">${currentUser.name[0].toUpperCase()}</div>
              <div>
                <div class="user-name">${currentUser.name}</div>
                <div class="user-role">${currentUser.role}</div>
              </div>
            </div>
            <button class="btn-logout" onclick="logout()">
              <i class="ti ti-logout"></i>
              SALIR
            </button>
          </div>
        </div>

        <div class="tabs">
          <div class="tab active" data-tab="groups">
            <i class="ti ti-layout-list"></i>
            FASE DE GRUPOS
          </div>
          <div class="tab" data-tab="knockout">
            <i class="ti ti-trophy"></i>
            FASE FINAL
          </div>
          ${currentUser.role === 'admin' ? `
            <div class="tab" data-tab="admin">
              <i class="ti ti-settings"></i>
              ADMINISTRACIÓN
            </div>
          ` : ''}
        </div>

        <div class="content">
          <div id="groups-content" class="tab-content"></div>
          <div id="knockout-content" class="tab-content" style="display: none;"></div>
          ${currentUser.role === 'admin' ? `<div id="admin-content" class="tab-content" style="display: none;"></div>` : ''}
        </div>
      `;

      document.getElementById('app').innerHTML = html;
      setupTabs();
      renderGroupPhase();
    }

    // ===== SETUP TABS =====
    function setupTabs() {
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', function() {
          const tabName = this.dataset.tab;
          document.querySelectorAll('.tab-content').forEach(content => content.style.display = 'none');
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          
          this.classList.add('active');
          
          if (tabName === 'groups') {
            document.getElementById('groups-content').style.display = 'block';
            renderGroupPhase();
          } else if (tabName === 'knockout') {
            document.getElementById('knockout-content').style.display = 'block';
            renderKnockout();
          } else if (tabName === 'admin') {
            document.getElementById('admin-content').style.display = 'block';
            renderAdmin();
          }
        });
      });
    }

    // ===== RENDERIZAR FASE DE GRUPOS =====
    function renderGroupPhase() {
      const container = document.getElementById('groups-content');
      let html = `
        <div class="card">
          <div class="card-title">
            <i class="ti ti-layout-list"></i>
            ${MATCHES_DATA['group-phase'].title}
          </div>
          ${isLocked ? '<div class="alert alert-locked"><i class="ti ti-lock"></i> Los pronósticos están bloqueados</div>' : ''}
      `;

      MATCHES_DATA['group-phase'].groups.forEach(group => {
        html += `
          <div class="phase-section">
            <div class="phase-header" onclick="togglePhase(this)">
              <div class="phase-header-content">
                <div class="phase-header-title">
                  <span>${group.name}</span>
                  <span class="phase-match-count">${group.matches.length} partidos</span>
                </div>
              </div>
              <i class="ti ti-chevron-down phase-toggle-icon open"></i>
            </div>
            <div class="phase-content open">
              <div class="phase-content-inner">
                ${group.matches.map(match => renderMatchCard(match)).join('')}
              </div>
            </div>
          </div>
        `;
      });

      html += `</div>`;
      container.innerHTML = html;
      setupMatchInputs();
    }

    // ===== RENDERIZAR TARJETA DE PARTIDO =====
    function renderMatchCard(match) {
      const pred = predictions[match.id] || {};
      const isMatchLocked = isLocked;
      
      return `
        <div class="match-card ${isMatchLocked ? 'locked' : ''}">
          <div class="match-date-venue">
            <div class="match-date-item">
              <i class="ti ti-calendar"></i>
              <span>${match.date} ${match.time}</span>
            </div>
            <div class="match-date-item">
              <i class="ti ti-map-pin"></i>
              <span>${match.venue}</span>
            </div>
          </div>
          
          <div class="pronostico-box">
            <div class="pronostico-row">
              <div class="team-input-group">
                <span class="team-flag">${match.flag1}</span>
                <span class="team-name-text">${match.team1}</span>
              </div>
              <input type="number" class="team-input" data-match="${match.id}" data-team="1" 
                min="0" max="9" value="${pred.team1 || ''}" ${isMatchLocked ? 'disabled' : ''} 
                placeholder="0">
              <span class="vs-separator">VS</span>
              <input type="number" class="team-input" data-match="${match.id}" data-team="2" 
                min="0" max="9" value="${pred.team2 || ''}" ${isMatchLocked ? 'disabled' : ''} 
                placeholder="0">
              <div class="team-input-group">
                <span class="team-flag">${match.flag2}</span>
                <span class="team-name-text">${match.team2}</span>
              </div>
            </div>
          </div>
          
          <div class="match-status ${pred.team1 !== undefined ? 'status-predicted' : 'status-pending'}">
            <i class="ti ti-circle-check"></i>
            ${pred.team1 !== undefined ? 'PRONÓSTICO GUARDADO' : 'PENDIENTE'}
          </div>
        </div>
      `;
    }

    // ===== SETUP INPUTS =====
    function setupMatchInputs() {
      document.querySelectorAll('.team-input').forEach(input => {
        input.addEventListener('change', (e) => {
          const matchId = parseInt(e.target.dataset.match);
          const team = e.target.dataset.team;
          
          if (!predictions[matchId]) {
            predictions[matchId] = {};
          }
          
          predictions[matchId][`team${team}`] = e.target.value ? parseInt(e.target.value) : undefined;
          localStorage.setItem('predictions', JSON.stringify(predictions));
          
          const card = e.target.closest('.match-card');
          const status = card.querySelector('.match-status');
          const hasPrediction = predictions[matchId].team1 !== undefined && predictions[matchId].team2 !== undefined;
          
          status.className = `match-status ${hasPrediction ? 'status-predicted' : 'status-pending'}`;
          status.innerHTML = hasPrediction ? 
            '<i class="ti ti-circle-check"></i> PRONÓSTICO GUARDADO' : 
            '<i class="ti ti-circle-check"></i> PENDIENTE';
        });
      });
    }

    // ===== TOGGLE FASE =====
    function togglePhase(header) {
      const icon = header.querySelector('.phase-toggle-icon');
      const content = header.nextElementSibling;
      icon.classList.toggle('open');
      content.classList.toggle('open');
    }

    // ===== FASE KNOCKOUT =====
    function renderKnockout() {
      const container = document.getElementById('knockout-content');
      const html = `
        <div class="card">
          <div class="card-title">
            <i class="ti ti-trophy"></i>
            ${MATCHES_DATA['knockout'].title}
          </div>
          <div class="bracket-container">
            <div class="bracket">
              <div class="bracket-round">
                <div class="bracket-round-title">Octavos de Final</div>
                <div class="bracket-match">
                  <div class="bracket-team">
                    <div class="bracket-team-info">
                      <span>🏆</span>
                      <span class="bracket-team-name">Ganador A1 vs B2</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
      container.innerHTML = html;
    }

    // ===== PANEL ADMIN =====
    function renderAdmin() {
      const container = document.getElementById('admin-content');
      const totalPredictions = Object.keys(predictions).length;
      
      const html = `
        <div class="card">
          <div class="card-title">
            <i class="ti ti-settings"></i>
            Panel de Administración
          </div>
          
          <div class="admin-grid">
            <div class="admin-stat">
              <i class="ti ti-users" style="font-size: 28px; color: var(--primary)"></i>
              <div class="admin-stat-value">1</div>
              <div class="admin-stat-label">Usuarios Activos</div>
            </div>
            <div class="admin-stat">
              <i class="ti ti-checks" style="font-size: 28px; color: var(--success)"></i>
              <div class="admin-stat-value">${totalPredictions}</div>
              <div class="admin-stat-label">Pronósticos Guardados</div>
            </div>
            <div class="admin-stat">
              <i class="ti ti-calendar" style="font-size: 28px; color: var(--accent)"></i>
              <div class="admin-stat-value">48</div>
              <div class="admin-stat-label">Partidos Totales</div>
            </div>
          </div>

          <div class="control-panel">
            <h3 style="color: var(--text-primary); margin-bottom: 1rem;">
              <i class="ti ti-lock"></i>
              Control de Pronósticos
            </h3>
            <div class="toggle-switch">
              <label class="switch">
                <input type="checkbox" ${isLocked ? 'checked' : ''} onchange="toggleLock(this)">
                <span class="slider"></span>
              </label>
              <span class="lock-status-text">${isLocked ? '🔒 Pronósticos Bloqueados' : '🔓 Pronósticos Abiertos'}</span>
            </div>
          </div>

          <div class="danger-zone">
            <h3 style="color: var(--text-primary); margin-bottom: 1rem;">
              <i class="ti ti-trash"></i>
              Peligro
            </h3>
            <button class="btn btn-primary btn-danger" onclick="if(confirm('¿Limpiar todos los pronósticos?')) { predictions = {}; localStorage.removeItem('predictions'); renderAdmin(); }">
              Limpiar Todos los Pronósticos
            </button>
          </div>
        </div>
      `;
      
      container.innerHTML = html;
    }

    // ===== BLOQUEAR/DESBLOQUEAR =====
    function toggleLock(checkbox) {
      isLocked = checkbox.checked;
      localStorage.setItem('isLocked', JSON.stringify(isLocked));
      renderGroupPhase();
      renderAdmin();
    }

    // ===== LOGOUT =====
    function logout() {
      if (confirm('¿Estás seguro de que quieres salir?')) {
        currentUser = null;
        localStorage.removeItem('user');
        init();
      }
    }

    // ===== INICIALIZACIÓN =====
    function init() {
      // Simular carga de 1 segundo para mejor UX
      setTimeout(() => {
        const savedUser = localStorage.getItem('user');
        
        if (savedUser) {
          currentUser = JSON.parse(savedUser);
          showApp();
        } else {
          showAuth();
        }
      }, 1000);
    }

    // Iniciar app cuando el DOM esté listo
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
