<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRODE Mundial 2026 - Sistema de Pronósticos</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tablericons/1.35.0/iconfont/tabler-icons.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --secondary: #ec4899;
      --accent: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --dark: #0f172a;
      --dark-secondary: #1e293b;
      --dark-tertiary: #334155;
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --border: #475569;
      --border-light: #334155;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 40px 80px rgba(0, 0, 0, 0.6);
    }
    
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 50%, #16213e 100%);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    h1, h2, h3, .bebas {
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 0.05em;
      font-weight: 700;
    }
    
    /* ===== LOADING SCREEN ===== */
    .loading-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
    }
    
    .loading-spinner {
      width: 80px;
      height: 80px;
      border: 4px solid rgba(99, 102, 241, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-text {
      font-size: 18px;
      color: var(--text-secondary);
      font-weight: 500;
    }
    
    /* ===== AUTH ===== */
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: linear-gradient(135deg, #0f172a 0%, #1e3c72 50%, #2a5298 100%);
      position: relative;
      overflow: hidden;
    }
    
    .auth-container::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: rgba(99, 102, 241, 0.1);
      border-radius: 50%;
      top: -100px;
      right: -100px;
      z-index: 0;
    }
    
    .auth-container::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: rgba(236, 72, 153, 0.1);
      border-radius: 50%;
      bottom: -50px;
      left: -50px;
      z-index: 0;
    }
    
    .auth-box {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 24px;
      padding: 2.5rem;
      width: 100%;
      max-width: 450px;
      box-shadow: var(--shadow-lg);
      position: relative;
      z-index: 1;
      animation: slideUp 0.5s ease;
    }
    
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .auth-logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      margin: 0 auto 1.5rem;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
    }
    
    .auth-title {
      font-size: 32px;
      text-align: center;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .auth-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 2rem;
      font-weight: 500;
    }
    
    .form-group {
      margin-bottom: 1rem;
    }
    
    .form-label {
      display: block;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
    }
    
    .form-input {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      color: var(--text-primary);
      padding: 12px 14px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s;
    }
    
    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(99, 102, 241, 0.1);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }
    
    .form-input::placeholder {
      color: var(--text-muted);
    }
    
    .btn {
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.3s;
      font-family: 'Inter', sans-serif;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
    }
    
    .auth-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 1.5rem;
    }
    
    .auth-toggle button {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 600;
    }
    
    .auth-toggle button.active {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(236, 72, 153, 0.2));
      border-color: var(--primary);
      color: var(--primary);
    }
    
    /* ===== HEADER ===== */
    .header {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(51, 65, 85, 0.4));
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-light);
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    
    .header-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
    }
    
    .header h1 {
      font-size: 24px;
      color: var(--text-primary);
    }
    
    .header p {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
    }
    
    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    
    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 10px 14px;
    }
    
    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    
    .user-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }
    
    .user-role {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    
    .btn-logout {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 8px 14px;
      font-size: 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .btn-logout:hover {
      border-color: var(--danger);
      color: var(--danger);
    }
    
    /* ===== TABS ===== */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border-light);
      background: rgba(30, 41, 59, 0.5);
      padding: 0 2rem;
      overflow-x: auto;
      gap: 8px;
      -webkit-overflow-scrolling: touch;
    }
    
    .tab {
      padding: 16px 20px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      border-bottom: 2px solid transparent;
      transition: all 0.3s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .tab:hover {
      color: var(--text-primary);
    }
    
    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    
    .tab i {
      font-size: 16px;
    }
    
    /* ===== CONTENT ===== */
    .content {
      padding: 2rem;
      max-width: 1600px;
      margin: 0 auto;
    }
    
    .tab-content {
      animation: fadeIn 0.3s ease-in;
      display: none;
    }
    
    .tab-content.active {
      display: block;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .card {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.6), rgba(51, 65, 85, 0.3));
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 2rem;
      backdrop-filter: blur(10px);
    }
    
    .card-title {
      font-size: 22px;
      color: var(--text-primary);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .card-title i {
      font-size: 28px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    /* ===== ALERT ===== */
    .alert {
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(10px);
    }
    
    .alert-locked {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(249, 115, 22, 0.1));
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      display: none;
    }
    
    .alert-locked.show {
      display: flex;
    }
    
    /* ===== PHASE ACCORDION ===== */
    .phase-section {
      background: linear-gradient(135deg, rgba(51, 65, 85, 0.3), rgba(30, 41, 59, 0.3));
      border: 1px solid var(--border-light);
      border-radius: 12px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }
    
    .phase-header {
      padding: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.3s;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(236, 72, 153, 0.05));
    }
    
    .phase-header:hover {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(236, 72, 153, 0.1));
    }
    
    .phase-header-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .phase-header-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .phase-match-count {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    
    .phase-toggle-icon {
      font-size: 20px;
      color: var(--primary);
      transition: transform 0.3s;
    }
    
    .phase-toggle-icon.open {
      transform: rotate(180deg);
    }
    
    .phase-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }
    
    .phase-content.open {
      max-height: 5000px;
    }
    
    .phase-content-inner {
      padding: 1.5rem;
      border-top: 1px solid var(--border-light);
    }
    
    /* ===== MATCH CARD ===== */
    .match-card {
      background: linear-gradient(135deg, rgba(51, 65, 85, 0.5), rgba(30, 41, 59, 0.5));
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 1.25rem;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
      margin-bottom: 1rem;
    }
    
    .match-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    .match-card:hover {
      border-color: var(--primary);
      box-shadow: 0 8px 32px rgba(99, 102, 241, 0.2);
      transform: translateY(-2px);
    }
    
    .match-card:hover::before {
      opacity: 1;
    }
    
    .match-card.locked {
      opacity: 0.6;
      pointer-events: none;
    }
    
    .match-date-venue {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    
    .match-date-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    /* ===== PRONÓSTICO BOX ===== */
    .pronostico-box {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(236, 72, 153, 0.1));
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 0.75rem;
    }
    
    .pronostico-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.75rem;
      justify-content: space-between;
    }
    
    .pronostico-row:last-child {
      margin-bottom: 0;
    }
    
    .team-input-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex: 1;
    }
    
    .team-flag {
      font-size: 28px;
      line-height: 1;
      min-width: 36px;
      text-align: center;
    }
    
    .team-name-text {
      font-weight: 600;
      font-size: 13px;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 80px;
    }
    
    .team-input {
      width: 70px;
      height: 40px;
      text-align: center;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      padding: 8px;
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      font-family: 'Inter', sans-serif;
      transition: all 0.3s;
    }
    
    .team-input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(99, 102, 241, 0.15);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }
    
    .team-input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .team-input::placeholder {
      color: var(--text-muted);
    }
    
    .team-input::-webkit-outer-spin-button,
    .team-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    
    .team-input[type=number] {
      -moz-appearance: textfield;
    }
    
    .match-status {
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
      margin-top: 0.75rem;
    }
    
    .status-pending {
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
    }
    
    .status-predicted {
      background: rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
    }
    
    .status-locked {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
    }
    
    /* ===== ADMIN ===== */
    .admin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    
    .admin-stat {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(236, 72, 153, 0.1));
      border: 1px solid var(--border-light);
      border-radius: 14px;
      padding: 1.5rem;
      text-align: center;
    }
    
    .admin-stat-value {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0.5rem 0;
    }
    
    .admin-stat-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }
    
    .control-panel {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(236, 72, 153, 0.05));
      border: 1px solid var(--border-light);
      border-radius: 14px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    
    .toggle-switch {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 1rem;
    }
    
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 28px;
    }
    
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--border);
      transition: .4s;
      border-radius: 28px;
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background: linear-gradient(135deg, var(--success), var(--success));
    }
    
    input:checked + .slider:before {
      transform: translateX(22px);
    }
    
    .lock-status-text {
      color: var(--text-primary);
      font-weight: 600;
      font-size: 14px;
    }
    
    /* ===== SCROLL ===== */
    ::-webkit-scrollbar {
      height: 8px;
      width: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    @media (max-width: 768px) {
      .content {
        padding: 1rem;
      }
      
      .card {
        padding: 1.5rem;
      }
      
      .tabs {
        padding: 0 1rem;
      }
      
      .tab {
        padding: 12px 16px;
        font-size: 12px;
      }
      
      .pronostico-row {
        flex-direction: column;
        gap: 0.5rem;
      }
      
      .team-input-group {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // ===== DATOS DE PARTIDOS =====

            { id: 6, date: "30 Jun", venue: "Los Angeles", team1: "Canadá", team2: "Panamá", flag1: "🇨🇦", flag2: "🇵🇦" }

        {

            { id: 7, date: "21 Jun", venue: "Dallas", team1: "España", team2: "Marruecos", flag1: "🇪🇸", flag2: "🇲🇦" },
            { id: 8, date: "21 Jun", venue: "Dallas", team1: "Alemania", team2: "México", flag1: "🇩🇪", flag2: "🇲🇽" },
            { id: 9, date: "26 Jun", venue: "Dallas", team1: "España", team2: "Alemania", flag1: "🇪🇸", flag2: "🇩🇪" },
            { id: 10, date: "26 Jun", venue: "Dallas", team1: "México", team2: "Marruecos", flag1: "🇲🇽", flag2: "🇲🇦" },
            { id: 11, date: "01 Jul", venue: "Dallas", team1: "España", team2: "México", flag1: "🇪🇸", flag2: "🇲🇽" },
            { id: 12, date: "01 Jul", venue: "Dallas", team1: "Alemania", team2: "Marruecos", flag1: "🇩🇪", flag2: "🇲🇦" }
          ]
        }
      ]
    };

    let currentUser = null;
    let predictions = JSON.parse(localStorage.getItem('predictions')) || {};
    let isLocked = JSON.parse(localStorage.getItem('isLocked')) || false;

    // ===== INIT =====
    function init() {
      const user = localStorage.getItem('currentUser');
      if (user) {
        currentUser = JSON.parse(user);
        showApp();
      } else {
        showAuth();
      }
    }

    // ===== AUTH =====
    function showAuth() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="auth-container">
          <div class="auth-box">
            <div class="auth-logo">⚽</div>
            <h1 class="auth-title">PRODE 2026</h1>
            <p class="auth-subtitle">Sistema de Pronósticos Mundial</p>
            
            <div class="auth-toggle">
              <button class="active" onclick="switchAuthMode('login')">INICIAR SESIÓN</button>
              <button onclick="switchAuthMode('register')">REGISTRARSE</button>
            </div>

            <form id="authForm" onsubmit="handleAuth(event)">
              <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-input" id="authEmail" placeholder="tu@email.com" required>
              </div>
              <div class="form-group">
                <label class="form-label">Contraseña</label>
                <input type="password" class="form-input" id="authPassword" placeholder="••••••••" required>
              </div>
              <div class="form-group" id="nameGroup" style="display: none;">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-input" id="authName" placeholder="Tu nombre completo">
              </div>
              <button type="submit" class="btn btn-primary">
                <i class="ti ti-login"></i> INGRESAR
              </button>
            </form>
          </div>
        </div>
      `;
    }

    function switchAuthMode(mode) {
      const form = document.getElementById('authForm');
      const nameGroup = document.getElementById('nameGroup');
      const buttons = document.querySelectorAll('.auth-toggle button');
      
      buttons.forEach((btn, i) => {
        btn.classList.toggle('active', (i === 0 && mode === 'login') || (i === 1 && mode === 'register'));
      });
      
      nameGroup.style.display = mode === 'register' ? 'block' : 'none';
      form.dataset.mode = mode;
    }

    function handleAuth(e) {
      e.preventDefault();
      const mode = document.getElementById('authForm').dataset.mode || 'login';
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;
      const name = mode === 'register' ? document.getElementById('authName').value : email.split('@')[0];

      currentUser = {
        id: Date.now(),
        email: email,
        name: name,
        avatar: name.charAt(0).toUpperCase(),
        role: 'player'
      };

      localStorage.setItem('currentUser', JSON.stringify(currentUser));
      showApp();
    }

    function logout() {
      localStorage.removeItem('currentUser');
      currentUser = null;
      showAuth();
    }

    // ===== APP =====
    function showApp() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="header">
          <div class="header-left">
            <div class="header-icon">⚽</div>
            <div>
              <h1>PRODE MUNDIAL 2026</h1>
              <p>Sistema de Pronósticos</p>
            </div>
          </div>
          <div class="header-right">
            <div class="user-info">
              <div class="user-avatar">${currentUser.avatar}</div>
              <div>
                <div class="user-name">${currentUser.name}</div>
                <div class="user-role">Jugador</div>
              </div>
            </div>
            <button class="btn-logout" onclick="logout()">
              <i class="ti ti-logout"></i> Salir
            </button>
          </div>
        </div>

        <div class="tabs">
          <div class="tab active" onclick="switchTab('pronosticos', this)">
            <i class="ti ti-ball-football"></i> Mis Pronósticos
          </div>
          <div class="tab" onclick="switchTab('tabla', this)">
            <i class="ti ti-trophy"></i> Tabla de Posiciones
          </div>
        </div>

        <div class="content">
          <div id="tab-pronosticos" class="tab-content active">
            <div class="card">
              <h2 class="card-title">
                <i class="ti ti-ball-football"></i> Completa tus Pronósticos
              </h2>
              
              <div class="alert alert-locked" id="alertLocked">
                <i class="ti ti-lock"></i> El período de pronósticos ha cerrado. No puedes realizar cambios.
              </div>

              <div id="phasesContainer"></div>
            </div>
          </div>

          <div id="tab-tabla" class="tab-content">
            <div class="card">
              <h2 class="card-title">
                <i class="ti ti-trophy"></i> Tabla de Posiciones
              </h2>
              <div id="leaderboardContainer"></div>
            </div>
          </div>
        </div>
      `;

      renderPhases();
      updateLockStatus();
    }

    function switchTab(tab, element) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      
      document.getElementById(`tab-${tab}`).classList.add('active');
      element.classList.add('active');
      
      if (tab === 'tabla') {
        renderLeaderboard();
      }
    }

    // ===== PRONÓSTICOS =====
    function renderPhases() {
      const container = document.getElementById('phasesContainer');
      container.innerHTML = '';

      MATCHES_DATA.groups.forEach((group, groupIndex) => {
        const phase = document.createElement('div');
        phase.className = 'phase-section';

        const header = document.createElement('div');
        header.className = 'phase-header';
        header.onclick = () => togglePhase(header);
        header.innerHTML = `
          <div class="phase-header-content">
            <div class="phase-header-title">
              <span>${group.name}</span>
            </div>
            <div class="phase-match-count">${group.matches.length} partidos</div>
          </div>
          <div class="phase-toggle-icon open">🔽</div>
        `;

        const content = document.createElement('div');
        content.className = 'phase-content open';
        content.innerHTML = `
          <div class="phase-content-inner">
            ${group.matches.map(match => renderMatch(match)).join('')}
          </div>
        `;

        phase.appendChild(header);
        phase.appendChild(content);
        container.appendChild(phase);
      });
    }

    function renderMatch(match) {
      const matchId = `match-${match.id}`;
      const team1Value = predictions[matchId]?.team1 || '';
      const team2Value = predictions[matchId]?.team2 || '';

      return `
        <div class="match-card ${isLocked ? 'locked' : ''}" data-match="${matchId}">
          <div class="match-date-venue">
            <div class="match-date-item">
              <i class="ti ti-calendar"></i> ${match.date}
            </div>
            <div class="match-date-item">
              <i class="ti ti-map-pin"></i> ${match.venue}
            </div>
          </div>

          <div class="pronostico-box">
            <div class="pronostico-row">
              <div class="team-input-group">
                <div class="team-flag">${match.flag1}</div>
                <div class="team-name-text">${match.team1}</div>
                <input 
                  type="number" 
                  min="1" 
                  max="50" 
                  class="team-input" 
                  data-match="${matchId}" 
                  data-team="team1"
                  placeholder="1-50"
                  ${isLocked ? 'disabled' : ''}
                  value="${team1Value}"
                  onchange="savePrediction('${matchId}', 'team1', this.value)"
                >
              </div>
            </div>

            <div class="pronostico-row">
              <div class="team-input-group">
                <div class="team-flag">${match.flag2}</div>
                <div class="team-name-text">${match.team2}</div>
                <input 
                  type="number" 
                  min="1" 
                  max="50" 
                  class="team-input" 
                  data-match="${matchId}" 
                  data-team="team2"
                  placeholder="1-50"
                  ${isLocked ? 'disabled' : ''}
                  value="${team2Value}"
                  onchange="savePrediction('${matchId}', 'team2', this.value)"
                >
              </div>
            </div>
          </div>

          <div class="match-status ${getMatchStatus(matchId)}">
            <i class="ti ti-${getMatchStatusIcon(matchId)}"></i>
            ${getMatchStatusText(matchId)}
          </div>
        </div>
      `;
    }

    function savePrediction(matchId, team, value) {
      if (!predictions[matchId]) {
        predictions[matchId] = {};
      }
      predictions[matchId][team] = value;
      localStorage.setItem('predictions', JSON.stringify(predictions));
      updateMatchStatus(matchId);
    }

    function getMatchStatus(matchId) {
      if (isLocked) return 'status-locked';
      const p = predictions[matchId];
      if (p && p.team1 && p.team2) return 'status-predicted';
      return 'status-pending';
    }

    function getMatchStatusText(matchId) {
      if (isLocked) return 'Cerrado';
      const p = predictions[matchId];
      if (p && p.team1 && p.team2) return 'Completado';
      return 'Pendiente';
    }

    function getMatchStatusIcon(matchId) {
      if (isLocked) return 'lock';
      const p = predictions[matchId];
      if (p && p.team1 && p.team2) return 'check';
      return 'clock';
    }

    function updateMatchStatus(matchId) {
      const card = document.querySelector(`[data-match="${matchId}"]`);
      if (!card) return;
      
      const status = card.querySelector('.match-status');
      status.className = `match-status ${getMatchStatus(matchId)}`;
      status.innerHTML = `
        <i class="ti ti-${getMatchStatusIcon(matchId)}"></i>
        ${getMatchStatusText(matchId)}
      `;
    }

    function togglePhase(header) {
      const content = header.nextElementSibling;
      const icon = header.querySelector('.phase-toggle-icon');
      content.classList.toggle('open');
      icon.classList.toggle('open');
    }

    // ===== LOCK STATUS =====
    function updateLockStatus() {
      const alert = document.getElementById('alertLocked');
      if (alert) {
        alert.classList.toggle('show', isLocked);
      }
    }

    // ===== LEADERBOARD =====
    function renderLeaderboard() {
      const container = document.getElementById('leaderboardContainer');
      container.innerHTML = `
        <table style="width: 100%; border-collapse: collapse;">
          <thead>
            <tr style="border-bottom: 2px solid var(--border-light);">
              <th style="text-align: left; padding: 12px; color: var(--text-muted); font-size: 12px; font-weight: 700;">POSICIÓN</th>
              <th style="text-align: left; padding: 12px; color: var(--text-muted); font-size: 12px; font-weight: 700;">JUGADOR</th>
              <th style="text-align: left; padding: 12px; color: var(--text-muted); font-size: 12px; font-weight: 700;">PUNTOS</th>
              <th style="text-align: left; padding: 12px; color: var(--text-muted); font-size: 12px; font-weight: 700;">COMPLETADOS</th>
            </tr>
          </thead>
          <tbody>
            <tr style="border-bottom: 1px solid var(--border-light);">
              <td style="padding: 12px; font-weight: 700; font-size: 16px; background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), transparent); width: 50px; text-align: center;">1</td>
              <td style="padding: 12px;">
                <div style="font-weight: 600; color: var(--text-primary);">Carlos</div>
                <div style="font-size: 12px; color: var(--text-muted);">carlos@prode.com</div>
              </td>
              <td style="padding: 12px; font-size: 18px; font-weight: 700; color: var(--primary);">45</td>
              <td style="padding: 12px; color: var(--text-secondary);">12/12 partidos</td>
            </tr>
          </tbody>
        </table>
      `;
    }

    // ===== START =====
    window.addEventListener('load', init);
  </script>
</body>
</html>
