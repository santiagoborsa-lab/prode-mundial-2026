<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRODE Mundial 2026 - Sistema de Pronósticos</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tablericons/1.35.0/iconfont/tabler-icons.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --secondary: #ec4899;
      --accent: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --dark: #0f172a;
      --dark-secondary: #1e293b;
      --dark-tertiary: #334155;
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --border: #475569;
      --border-light: #334155;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 40px 80px rgba(0, 0, 0, 0.6);
    }
    
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 50%, #16213e 100%);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    h1, h2, h3, .bebas {
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 0.05em;
      font-weight: 700;
    }
    
    /* ===== AUTH ===== */
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: linear-gradient(135deg, #0f172a 0%, #1e3c72 50%, #2a5298 100%);
      position: relative;
      overflow: hidden;
    }
    
    .auth-container::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: rgba(99, 102, 241, 0.1);
      border-radius: 50%;
      top: -100px;
      right: -100px;
      z-index: 0;
    }
    
    .auth-container::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: rgba(236, 72, 153, 0.1);
      border-radius: 50%;
      bottom: -50px;
      left: -50px;
      z-index: 0;
    }
    
    .auth-box {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 24px;
      padding: 2.5rem;
      width: 100%;
      max-width: 450px;
      box-shadow: var(--shadow-lg);
      position: relative;
      z-index: 1;
    }
    
    .auth-logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      margin: 0 auto 1.5rem;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
    }
    
    .auth-title {
      font-size: 32px;
      text-align: center;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .auth-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 2rem;
      font-weight: 500;
    }
    
    .form-group {
      margin-bottom: 1rem;
    }
    
    .form-label {
      display: block;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
    }
    
    .form-input {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      color: var(--text-primary);
      padding: 12px 14px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s;
    }
    
    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(99, 102, 241, 0.1);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }
    
    .form-input::placeholder {
      color: var(--text-muted);
    }
    
    .btn {
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.3s;
      font-family: 'Inter', sans-serif;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
      width: 100%;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
    }
    
    .btn-small {
      padding: 8px 16px;
      font-size: 12px;
      width: auto;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
    }
    
    .btn-small:hover {
      transform: translateY(-2px);
    }
    
    .auth-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 1.5rem;
    }
    
    .auth-toggle button {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 600;
    }
    
    .auth-toggle button.active {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(236, 72, 153, 0.2));
      border-color: var(--primary);
      color: var(--primary);
    }
    
    /* ===== HEADER ===== */
    .header {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(51, 65, 85, 0.4));
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-light);
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    
    .header-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
    }
    
    .header h1 {
      font-size: 24px;
      color: var(--text-primary);
    }
    
    .header p {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
    }
    
    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    
    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 10px 14px;
    }
    
    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    
    .user-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }
    
    .user-role {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    
    .admin-badge {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(249, 115, 22, 0.2));
      border: 1px solid var(--danger);
      color: #fca5a5;
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 700;
    }
    
    .btn-logout {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 8px 14px;
      font-size: 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .btn-logout:hover {
      border-color: var(--danger);
      color: var(--danger);
    }
    
    /* ===== TABS ===== */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border-light);
      background: rgba(30, 41, 59, 0.5);
      padding: 0 2rem;
      overflow-x: auto;
      gap: 8px;
      -webkit-overflow-scrolling: touch;
    }
    
    .tab {
      padding: 16px 20px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      border-bottom: 2px solid transparent;
      transition: all 0.3s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .tab:hover {
      color: var(--text-primary);
    }
    
    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    
    .tab i {
      font-size: 16px;
    }
    
    /* ===== CONTENT ===== */
    .content {
      padding: 2rem;
      max-width: 1600px;
      margin: 0 auto;
    }
    
    .tab-content {
      animation: fadeIn 0.3s ease-in;
      display: none;
    }
    
    .tab-content.active {
      display: block;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .card {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.6), rgba(51, 65, 85, 0.3));
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 2rem;
      backdrop-filter: blur(10px);
    }
    
    .card-title {
      font-size: 22px;
      color: var(--text-primary);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .card-title i {
      font-size: 28px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    /* ===== ALERT ===== */
    .alert {
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(10px);
    }
    
    .alert-locked {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(249, 115, 22, 0.1));
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      display: none;
    }
    
    .alert-locked.show {
      display: flex;
    }
    
    .alert-winner {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(34, 197, 94, 0.15));
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #86efac;
      display: none;
    }
    
    .alert-winner.show {
      display: flex;
    }
    
    /* ===== FILTER SECTION ===== */
    .filter-section {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(236, 72, 153, 0.05));
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    
    .filter-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    
    .filter-btn {
      padding: 10px 16px;
      background: linear-gradient(135deg, rgba(51, 65, 85, 0.5), rgba(30, 41, 59, 0.5));
      border: 1px solid var(--border-light);
      border-radius: 8px;
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      white-space: nowrap;
    }
    
    .filter-btn:hover {
      border-color: var(--primary);
    }
    
    .filter-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border-color: var(--primary);
    }
    
    /* ===== PHASE ACCORDION ===== */
    .phase-section {
      background: linear-gradient(135deg, rgba(51, 65, 85, 0.3), rgba(30, 41, 59, 0.3));
      border: 1px solid var(--border-light);
      border-radius: 12px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }
    
    .phase-header {
      padding: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.3s;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(236, 72, 153, 0.05));
    }
    
    .phase-header:hover {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(236, 72, 153, 0.1));
    }
    
    .phase-header-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .phase-header-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
    }
    
    .phase-match-count {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    
    .phase-toggle-icon {
      font-size: 20px;
      color: var(--primary);
      transition: transform 0.3s;
    }
    
    .phase-toggle-icon.open {
      transform: rotate(180deg);
    }
    
    .phase-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }
    
    .phase-content.open {
      max-height: 5000px;
    }
    
    .phase-content-inner {
      padding: 1.5rem;
      border-top: 1px solid var(--border-light);
    }
    
    /* ===== MATCH CARD ===== */
    .match-card {
      background: linear-gradient(135deg, rgba(51, 65, 85, 0.5), rgba(30, 41, 59, 0.5));
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 1.25rem;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
      margin-bottom: 1rem;
    }
    
    .match-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    .match-card:hover {
      border-color: var(--primary);
      box-shadow: 0 8px 32px rgba(99, 102, 241, 0.2);
      transform: translateY(-2px);
    }
    
    .match-card:hover::before {
      opacity: 1;
    }
    
    .match-card.locked {
      opacity: 0.6;
      pointer-events: none;
    }
    
    .match-date-venue {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    
    .match-date-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    /* ===== MATCH TEAMS ===== */
    .match-teams {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(236, 72, 153, 0.1));
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
    }
    
    .team-section {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex: 1;
    }
    
    .team-flag {
      font-size: 32px;
      line-height: 1;
      min-width: 40px;
      text-align: center;
    }
    
    .team-name {
      font-weight: 600;
      font-size: 14px;
      color: var(--text-primary);
      flex: 1;
    }
    
    .team-input {
      width: 70px;
      height: 40px;
      text-align: center;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      padding: 8px;
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      font-family: 'Inter', sans-serif;
      transition: all 0.3s;
    }
    
    .team-input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(99, 102, 241, 0.15);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }
    
    .team-input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .team-input::placeholder {
      color: var(--text-muted);
    }
    
    .team-input::-webkit-outer-spin-button,
    .team-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    
    .team-input[type=number] {
      -moz-appearance: textfield;
    }
    
    .vs-text {
      color: var(--text-muted);
      font-weight: 700;
      font-size: 12px;
      padding: 0 0.5rem;
    }
    
    .match-status {
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
      margin-top: 0.75rem;
    }
    
    .status-pending {
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
    }
    
    .status-predicted {
      background: rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
    }
    
    .status-locked {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
    }
    
    /* ===== BRACKETS ===== */
    .brackets-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
    }
    
    .bracket-phase {
      background: linear-gradient(135deg, rgba(51, 65, 85, 0.3), rgba(30, 41, 59, 0.3));
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 1.5rem;
    }
    
    .bracket-phase-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 1rem;
      text-align: center;
    }
    
    .bracket-match {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-light);
      border-radius: 10px;
      padding: 0.75rem;
      margin-bottom: 0.75rem;
      font-size: 12px;
    }
    
    .bracket-match-team {
      padding: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }
    
    .bracket-team-name {
      flex: 1;
      color: var(--text-secondary);
    }
    
    .bracket-team-result {
      font-weight: 700;
      color: var(--primary);
      min-width: 40px;
      text-align: right;
    }
    
    /* ===== TEAMS STANDINGS ===== */
    .standings-table {
      width: 100%;
      border-collapse: collapse;
    }
    
    .standings-table thead tr {
      border-bottom: 2px solid var(--border-light);
    }
    
    .standings-table th {
      text-align: left;
      padding: 12px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    
    .standings-table td {
      padding: 12px;
      border-bottom: 1px solid var(--border-light);
    }
    
    .standings-table tbody tr:hover {
      background: rgba(99, 102, 241, 0.05);
    }
    
    .team-image {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }
    
    .team-name-cell {
      font-weight: 600;
      color: var(--text-primary);
    }
    
    .points-badge {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(236, 72, 153, 0.2));
      color: var(--primary);
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
      text-align: center;
      min-width: 60px;
    }
    
    /* ===== USER STATS ===== */
    .user-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    
    .stat-card {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(236, 72, 153, 0.1));
      border: 1px solid var(--border-light);
      border-radius: 14px;
      padding: 1.5rem;
      text-align: center;
    }
    
    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    
    .stat-value {
      font-size: 36px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .stat-detail {
      font-size: 12px;

</head>

      ]
    };

    // ===== DATOS DE EQUIPOS =====
    const TEAMS_DATA = [
      { id: 1, name: "Argentina", flag: "🇦🇷", icon: "⚽", group: "A" },
      { id: 2, name: "Canadá", flag: "🇨🇦", icon: "🏒", group: "A" },
      { id: 3, name: "Perú", flag: "🇵🇪", icon: "🦅", group: "A" },
      { id: 4, name: "Panamá", flag: "🇵🇦", icon: "🎭", group: "A" },
      { id: 5, name: "España", flag: "🇪🇸", icon: "🐂", group: "B" },
      { id: 6, name: "Alemania", flag: "🇩🇪", icon: "🍺", group: "B" },
      { id: 7, name: "México", flag: "🇲🇽", icon: "🌮", group: "B" },
      { id: 8, name: "Marruecos", flag: "🇲🇦", icon: "🕌", group: "B" }
    ];

    let currentUser = null;
    let predictions = JSON.parse(localStorage.getItem('predictions')) || {};
    let results = JSON.parse(localStorage.getItem('results')) || {};
    let isLocked = JSON.parse(localStorage.getItem('isLocked')) || false;
    let winner = JSON.parse(localStorage.getItem('winner')) || null;
    let activeFilters = new Set(MATCHES_DATA.groups.map(g => g.id));

    // ===== INIT =====
    function init() {
      const user = localStorage.getItem('currentUser');
      if (user) {
        currentUser = JSON.parse(user);
        showApp();
      } else {
        showAuth();
      }
    }

    // ===== AUTH =====
    function showAuth() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="auth-container">
          <div class="auth-box">
            <div class="auth-logo">⚽</div>
            <h1 class="auth-title">PRODE 2026</h1>
            <p class="auth-subtitle">Sistema de Pronósticos Mundial</p>
            
            <div class="auth-toggle">
              <button class="active" onclick="switchAuthMode('login')">INICIAR SESIÓN</button>
              <button onclick="switchAuthMode('register')">REGISTRARSE</button>
            </div>

            <form id="authForm" onsubmit="handleAuth(event)">
              <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-input" id="authEmail" placeholder="tu@email.com" required>
              </div>
              <div class="form-group">
                <label class="form-label">Contraseña</label>
                <input type="password" class="form-input" id="authPassword" placeholder="••••••••" required>
              </div>
              <div class="form-group" id="nameGroup" style="display: none;">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-input" id="authName" placeholder="Tu nombre completo">
              </div>
              <div class="form-group" id="adminGroup" style="display: none;">
                <label class="form-label">
                  <input type="checkbox" id="isAdmin" style="margin-right: 6px;">
                  Soy Administrador
                </label>
              </div>
              <button type="submit" class="btn btn-primary">
                <i class="ti ti-login"></i> INGRESAR
              </button>
            </form>
          </div>
        </div>
      `;
    }

    function switchAuthMode(mode) {
      const form = document.getElementById('authForm');
      const nameGroup = document.getElementById('nameGroup');
      const adminGroup = document.getElementById('adminGroup');
      const buttons = document.querySelectorAll('.auth-toggle button');
      
      buttons.forEach((btn, i) => {
        btn.classList.toggle('active', (i === 0 && mode === 'login') || (i === 1 && mode === 'register'));
      });
      
      nameGroup.style.display = mode === 'register' ? 'block' : 'none';
      adminGroup.style.display = mode === 'register' ? 'block' : 'none';
      form.dataset.mode = mode;
    }

    function handleAuth(e) {
      e.preventDefault();
      const mode = document.getElementById('authForm').dataset.mode || 'login';
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;
      const name = mode === 'register' ? document.getElementById('authName').value : email.split('@')[0];
      const isAdmin = mode === 'register' && document.getElementById('isAdmin').checked;

      currentUser = {
        id: Date.now(),
        email: email,
        name: name,
        avatar: name.charAt(0).toUpperCase(),
        role: isAdmin ? 'admin' : 'player'
      };

      localStorage.setItem('currentUser', JSON.stringify(currentUser));
      showApp();
    }

    function logout() {
      localStorage.removeItem('currentUser');
      currentUser = null;
      showAuth();
    }

    // ===== APP =====
    function showApp() {
      const app = document.getElementById('app');
      const adminTabs = currentUser.role === 'admin' ? `
        <div class="tab" onclick="switchTab('cruces', this)">
          <i class="ti ti-bracket"></i> Cruces
        </div>
        <div class="tab" onclick="switchTab('equipos', this)">
          <i class="ti ti-shirt"></i> Equipos
        </div>
        <div class="tab" onclick="switchTab('stats', this)">
          <i class="ti ti-chart-bar"></i> Mi Resumen
        </div>
        <div class="tab" onclick="switchTab('admin', this)">
          <i class="ti ti-lock"></i> Panel Admin
        </div>
      ` : `
        <div class="tab" onclick="switchTab('cruces', this)">
          <i class="ti ti-bracket"></i> Cruces
        </div>
        <div class="tab" onclick="switchTab('equipos', this)">
          <i class="ti ti-shirt"></i> Equipos
        </div>
        <div class="tab" onclick="switchTab('stats', this)">
          <i class="ti ti-chart-bar"></i> Mi Resumen
        </div>
      `;

      app.innerHTML = `
        <div class="header">
          <div class="header-left">
            <div class="header-icon">⚽</div>
            <div>
              <h1>PRODE MUNDIAL 2026</h1>
              <p>Sistema de Pronósticos</p>
            </div>
          </div>
          <div class="header-right">
            <div class="user-info">
              <div class="user-avatar">${currentUser.avatar}</div>
              <div>
                <div class="user-name">${currentUser.name}</div>
                <div class="user-role">${currentUser.role === 'admin' ? '👑 Administrador' : 'Jugador'}</div>
              </div>
            </div>
            ${currentUser.role === 'admin' ? '<span class="admin-badge">ADMIN</span>' : ''}
            <button class="btn-logout" onclick="logout()">
              <i class="ti ti-logout"></i> Salir
            </button>
          </div>
        </div>

        <div class="tabs">
          <div class="tab active" onclick="switchTab('pronosticos', this)">
            <i class="ti ti-ball-football"></i> Mis Pronósticos
          </div>
          <div class="tab" onclick="switchTab('tabla', this)">
            <i class="ti ti-trophy"></i> Tabla de Posiciones
          </div>
          ${adminTabs}
        </div>

        <div class="content">
          <div id="tab-pronosticos" class="tab-content active">
            <div class="card">
              <h2 class="card-title">
                <i class="ti ti-ball-football"></i> Completa tus Pronósticos
              </h2>
              
              <div class="alert alert-winner" id="alertWinner">
                <i class="ti ti-crown"></i> ¡Ganador del PRODE: <span id="winnerName"></span>!
              </div>
              
              <div class="alert alert-locked" id="alertLocked">
                <i class="ti ti-lock"></i> El período de pronósticos ha cerrado. No puedes realizar cambios.
              </div>

              <div class="filter-section">
                <div class="filter-title">
                  <i class="ti ti-filter"></i> Filtrar por Grupo
                </div>
                <div class="filter-buttons" id="filterButtons"></div>
              </div>

              <div id="phasesContainer"></div>
            </div>
          </div>

          <div id="tab-tabla" class="tab-content">
            <div class="card">
              <h2 class="card-title">
                <i class="ti ti-trophy"></i> Tabla de Posiciones
              </h2>
              <div id="leaderboardContainer"></div>
            </div>
          </div>

          <div id="tab-cruces" class="tab-content">
            <div class="card">
              <h2 class="card-title">
                <i class="ti ti-bracket"></i> Cruces Oficiales
              </h2>
              <div id="crossesContainer"></div>
            </div>
          </div>

          <div id="tab-equipos" class="tab-content">
            <div class="card">
              <h2 class="card-title">
                <i class="ti ti-shirt"></i> Resumen de Equipos
              </h2>
              <div id="teamsContainer"></div>
            </div>
          </div>

          <div id="tab-stats" class="tab-content">
            <div class="card">
              <h2 class="card-title">
                <i class="ti ti-chart-bar"></i> Mi Resumen de Puntos
              </h2>
              <div id="statsContainer"></div>
            </div>
          </div>

          ${currentUser.role === 'admin' ? `
            <div id="tab-admin" class="tab-content">
              <div class="card">
                <h2 class="card-title">
                  <i class="ti ti-lock"></i> Panel de Administración
                </h2>
                <div id="adminContainer"></div>
              </div>
            </div>
          ` : ''}
        </div>
      `;

      renderFilters();
      renderPhases();
      updateLockStatus();
    }

    function switchTab(tab, element) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      
      const tabElement = document.getElementById(`tab-${tab}`);
      if (tabElement) {
        tabElement.classList.add('active');
        element.classList.add('active');
        
        if (tab === 'tabla') {
          renderLeaderboard();
        } else if (tab === 'cruces') {
          renderCrosses();
        } else if (tab === 'equipos') {
          renderTeams();
        } else if (tab === 'stats') {
          renderUserStats();
        } else if (tab === 'admin') {
          renderAdminPanel();
        }
      }
    }

    // ===== FILTERS =====
    function renderFilters() {
      const container = document.getElementById('filterButtons');
      if (!container) return;
      container.innerHTML = '';

      MATCHES_DATA.groups.forEach(group => {
        const btn = document.createElement('button');
        btn.className = `filter-btn active`;
        btn.textContent = `Grupo ${group.id}`;
        btn.onclick = (e) => {
          e.preventDefault();
          toggleFilter(group.id, btn);
        };
        container.appendChild(btn);
      });
    }

    function toggleFilter(groupId, btn) {
      if (activeFilters.has(groupId)) {
        activeFilters.delete(groupId);
        btn.classList.remove('active');
      } else {
        activeFilters.add(groupId);
        btn.classList.add('active');
      }
      renderPhases();
    }

    // ===== PRONÓSTICOS =====
    function renderPhases() {
      const container = document.getElementById('phasesContainer');
      if (!container) return;
      container.innerHTML = '';

      MATCHES_DATA.groups.forEach((group) => {
        if (!activeFilters.has(group.id)) return;

        const phase = document.createElement('div');
        phase.className = 'phase-section';

        const header = document.createElement('div');
        header.className = 'phase-header';
        header.onclick = () => togglePhase(header);
        header.innerHTML = `
          <div class="phase-header-content">
            <div class="phase-header-title">
              ${group.name}
            </div>
            <div class="phase-match-count">${group.matches.length} partidos</div>
          </div>
          <div class="phase-toggle-icon open">🔽</div>
        `;

        const content = document.createElement('div');
        content.className = 'phase-content open';
        content.innerHTML = `
          <div class="phase-content-inner">
            ${group.matches.map(match => renderMatch(match)).join('')}
          </div>
        `;

        phase.appendChild(header);
        phase.appendChild(content);
        container.appendChild(phase);
      });
    }

    function renderMatch(match) {
      const matchId = `match-${match.id}`;
      const team1Value = predictions[matchId]?.team1 || '';
      const team2Value = predictions[matchId]?.team2 || '';

      return `
        <div class="match-card ${isLocked ? 'locked' : ''}" data-match="${matchId}">
          <div class="match-date-venue">
            <div class="match-date-item">
              <i class="ti ti-calendar"></i> ${match.date}
            </div>
            <div class="match-date-item">
              <i class="ti ti-map-pin"></i> ${match.venue}
            </div>
          </div>

          <div class="match-teams">
            <div class="team-section">
              <div class="team-flag">${match.flag1}</div>
              <div class="team-name">${match.team1}</div>
            </div>
            <input 
              type="number" 
              min="1" 
              max="50" 
              class="team-input" 
              data-match="${matchId}" 
              data-team="team1"
              placeholder="1-50"
              ${isLocked ? 'disabled' : ''}
              value="${team1Value}"
              onchange="savePrediction('${matchId}', 'team1', this.value)"
            >
            <div class="vs-text">VS</div>
            <input 
              type="number" 
              min="1" 
              max="50" 
              class="team-input" 
              data-match="${matchId}" 
              data-team="team2"
              placeholder="1-50"
              ${isLocked ? 'disabled' : ''}
              value="${team2Value}"
              onchange="savePrediction('${matchId}', 'team2', this.value)"
            >
            <div class="team-section">
              <div class="team-name">${match.team2}</div>
              <div class="team-flag">${match.flag2}</div>
            </div>
          </div>

          <div class="match-status ${getMatchStatus(matchId)}">
            <i class="ti ti-${getMatchStatusIcon(matchId)}"></i>
            ${getMatchStatusText(matchId)}
          </div>
        </div>
      `;
    }

    function savePrediction(matchId, team, value) {
      if (!predictions[matchId]) {
        predictions[matchId] = {};
      }
      predictions[matchId][team] = value;
      localStorage.setItem('predictions', JSON.stringify(predictions));
      updateMatchStatus(matchId);
    }

    function getMatchStatus(matchId) {
      if (isLocked) return 'status-locked';
      const p = predictions[matchId];
      if (p && p.team1 && p.team2) return 'status-predicted';
      return 'status-pending';
    }

    function getMatchStatusText(matchId) {
      if (isLocked) return 'Cerrado';
      const p = predictions[matchId];
      if (p && p.team1 && p.team2) return 'Completado';
      return 'Pendiente';
    }

    function getMatchStatusIcon(matchId) {
      if (isLocked) return 'lock';
      const p = predictions[matchId];
      if (p && p.team1 && p.team2) return 'check';
      return 'clock';
    }

    function updateMatchStatus(matchId) {
      const card = document.querySelector(`[data-match="${matchId}"]`);
      if (!card) return;
      
      const status = card.querySelector('.match-status');
      status.className = `match-status ${getMatchStatus(matchId)}`;
      status.innerHTML = `
        <i class="ti ti-${getMatchStatusIcon(matchId)}"></i>
        ${getMatchStatusText(matchId)}
      `;
    }

    function togglePhase(header) {
      const content = header.nextElementSibling;
      const icon = header.querySelector('.phase-toggle-icon');
      content.classList.toggle('open');
      icon.classList.toggle('open');
    }

    // ===== LEADERBOARD =====
    function renderLeaderboard() {
      const container = document.getElementById('leaderboardContainer');
      if (!container) return;
      container.innerHTML = `
        <table class="standings-table">
          <thead>
            <tr>
              <th>POSICIÓN</th>
              <th>JUGADOR</th>
              <th>PUNTOS</th>
              <th>COMPLETADOS</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td style="font-weight: 700; font-size: 16px; background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), transparent); text-align: center;">1</td>
              <td>
                <div style="font-weight: 600; color: var(--text-primary);">Carlos</div>
                <div style="font-size: 12px; color: var(--text-muted);">carlos@prode.com</div>
              </td>
              <td><div class="points-badge">45</div></td>
              <td style="color: var(--text-secondary);">12/12 partidos</td>
            </tr>
          </tbody>
        </table>
      `;
    }

    // ===== CRUCES =====
    function renderCrosses() {
      const container = document.getElementById('crossesContainer');
      if (!container) return;
      
      let html = '<div class="brackets-container">';
      
      MATCHES_DATA.knockout.forEach(phase => {
        html += `
          <div class="bracket-phase">
            <div class="bracket-phase-title">${phase.phase}</div>
            ${phase.matches.map(match => `
              <div class="bracket-match">
                <div class="bracket-match-team">
                  <div class="bracket-team-name">${match.team1}</div>
                  <div class="bracket-team-result">${results[`match-${match.id}`]?.team1 || '-'}</div>
                </div>
                <div class="bracket-match-team">
                  <div class="bracket-team-name">${match.team2}</div>
                  <div class="bracket-team-result">${results[`match-${match.id}`]?.team2 || '-'}</div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      });
      
      html += '</div>';
      container.innerHTML = html;
    }

    // ===== TEAMS =====
    function renderTeams() {
      const container = document.getElementById('teamsContainer');
      if (!container) return;
      
      let html = `
        <table class="standings-table">
          <thead>
            <tr>
              <th>EQUIPO</th>
              <th>GRUPO</th>
              <th>PUNTOS</th>
            </tr>
          </thead>
          <tbody>
      `;
      
      TEAMS_DATA.forEach(team => {
        const points = Math.floor(Math.random() * 15); // Simulado
        html += `
          <tr>
            <td>
              <div style="display: flex; align-items: center; gap: 0.75rem;">
                <div class="team-image">${team.flag}</div>
                <div class="team-name-cell">${team.name}</div>
              </div>
            </td>
            <td>Grupo ${team.group}</td>
            <td><div class="points-badge">${points}</div></td>
          </tr>
        `;
      });
      
      html += `
          </tbody>
        </table>
      `;
      
      container.innerHTML = html;
    }

    // ===== USER STATS =====
    function renderUserStats() {
      const container = document.getElementById('statsContainer');
      if (!container) return;
      
      const completedMatches = Object.keys(predictions).filter(k => predictions[k].team1 && predictions[k].team2).length;
      const totalMatches = 12;
      const groupPoints = Math.floor(Math.random() * 120);
      const knockoutPoints = Math.floor(Math.random() * 80);
      
      container.innerHTML = `
        <div class="user-stats-grid">
          <div class="stat-card">
            <div class="stat-label">Puntos Totales</div>
            <div class="stat-value">${groupPoints + knockoutPoints}</div>
            <div class="stat-detail">Acumulado en el torneo</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Fase de Grupos</div>
            <div class="stat-value">${groupPoints}</div>
            <div class="stat-detail">${completedMatches}/12 predicciones</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Fases Eliminatorias</div>
            <div class="stat-value">${knockoutPoints}</div>
            <div class="stat-detail">Puntos acumulados</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Progreso</div>
            <div class="stat-value">${Math.round((completedMatches/totalMatches)*100)}%</div>
            <div class="stat-detail">${completedMatches} de ${totalMatches} completados</div>
          </div>
        </div>
      `;
    }

    // ===== ADMIN PANEL =====
    function renderAdminPanel() {
      const container = document.getElementById('adminContainer');
      if (!container) return;
      
      container.innerHTML = `
        <div class="admin-panel">
          <!-- Cerrar Fase -->
          <div class="admin-section">
            <div class="admin-section-title">
              <i class="ti ti-lock"></i> Cerrar Pronósticos
            </div>
            <div class="admin-controls">
              <button class="admin-btn" onclick="toggleLock()">
                ${isLocked ? '🔓 Abrir Pronósticos' : '🔒 Cerrar Pronósticos'}
              </button>
            </div>
          </div>

          <!-- Cargar Resultados -->
          <div class="admin-section">
            <div class="admin-section-title">
              <i class="ti ti-edit"></i> Cargar Resultados
            </div>
            <div class="admin-controls" style="grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem;">
              <select class="admin-input" id="matchSelect">
                <option value="">Seleccionar Partido</option>
                ${[...MATCHES_DATA.groups.flatMap(g => g.matches), ...MATCHES_DATA.knockout.flatMap(p => p.matches)]
                  .map(m => `<option value="${m.id}">${m.team1} vs ${m.team2}</option>`).join('')}
              </select>
              <input type="number" class="admin-input" id="result1" placeholder="Resultado Equipo 1" min="0" max="50">
              <input type="number" class="admin-input" id="result2" placeholder="Resultado Equipo 2" min="0" max="50">
              <button class="admin-btn" onclick="saveResult()">Guardar Resultado</button>
            </div>
          </div>

          <!-- Anunciar Ganador -->
          <div class="admin-section">
            <div class="admin-section-title">
              <i class="ti ti-crown"></i> Anunciar Ganador
            </div>
            <div class="admin-controls" style="gap: 1rem;">
              <input type="text" class="admin-input" id="winnerInput" placeholder="Nombre del Ganador" style="flex: 1;">
              <button class="admin-btn" onclick="declareWinner()">Anunciar Ganador</button>
            </div>
          </div>

          <!-- Resumen en Tiempo Real -->
          <div class="admin-section">
            <div class="admin-section-title">
              <i class="ti ti-chart-bar"></i> Resumen en Tiempo Real
            </div>
            <div id="realtimeStats"></div>
          </div>
        </div>
      `;

      updateRealtimeStats();
    }

    function updateRealtimeStats() {
      const container = document.getElementById('realtimeStats');
      if (!container) return;
      
      container.innerHTML = `
        <table class="standings-table">
          <thead>
            <tr>
              <th>Usuario</th>
              <th>Completados</th>
              <th>Puntos Estimados</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Santiago</td>
              <td>8/12</td>
              <td><div class="points-badge">32</div></td>
            </tr>
            <tr>
              <td>Carlos</td>
              <td>12/12</td>
              <td><div class="points-badge">45</div></td>
            </tr>
          </tbody>
        </table>
      `;
    }

    function toggleLock() {
      isLocked = !isLocked;
      localStorage.setItem('isLocked', JSON.stringify(isLocked));
      updateLockStatus();
      renderPhases();
      renderAdminPanel();
    }

    function saveResult() {
      const matchId = document.getElementById('matchSelect').value;
      const result1 = document.getElementById('result1').value;
      const result2 = document.getElementById('result2').value;

      if (!matchId || !result1 || !result2) {
        alert('Por favor completa todos los campos');
        return;
      }

      if (!results[`match-${matchId}`]) {
        results[`match-${matchId}`] = {};
      }
      results[`match-${matchId}`].team1 = result1;
      results[`match-${matchId}`].team2 = result2;
      localStorage.setItem('results', JSON.stringify(results));
      
      document.getElementById('result1').value = '';
      document.getElementById('result2').value = '';
      document.getElementById('matchSelect').value = '';
      
      alert('Resultado guardado correctamente');
      updateRealtimeStats();
    }

    function declareWinner() {
      const winnerName = document.getElementById('winnerInput').value;
      if (!winnerName) {
        alert('Ingresa el nombre del ganador');
        return;
      }
      
      winner = winnerName;
      localStorage.setItem('winner', JSON.stringify(winner));
      document.getElementById('winnerInput').value = '';
      updateLockStatus();
      alert(`¡${winnerName} es el ganador del PRODE 2026!`);
    }

    // ===== LOCK STATUS =====
    function updateLockStatus() {
      const alertLocked = document.getElementById('alertLocked');
      const alertWinner = document.getElementById('alertWinner');
      
      if (alertLocked) {
        alertLocked.classList.toggle('show', isLocked);
      }
      
      if (alertWinner && winner) {
        document.getElementById('winnerName').textContent = winner;
        alertWinner.classList.add('show');
      }
    }

    // ===== START =====
    window.addEventListener('load', init);
  </script>
</body>
</html>
